        <!-- ===== AI Planner ===== -->
        <section id="ai-planner">
            <div class="card shadow-sm border-primary-subtle">
                <div class="card-body p-4">
                    <h2 class="h4">AI Trip Suggestions</h2>
                    <p class="text-body-secondary">Tell the AI what you like and it will suggest activities for your
                        trip.</p>
                    <form id="aiForm" class="row g-3">
                        <div class="col-md-5">
                            <label for="aiDestination" class="form-label">Destination</label>
                            <input type="text" class="form-control" id="aiDestination"
                                placeholder="e.g. Jeju, South Korea" required>
                        </div>
                        <div class="col-md-3">
                            <label for="aiDays" class="form-label">Days</label>
                            <input type="number" class="form-control" id="aiDays" min="1" max="14" value="3">
                        </div>
                        <div class="col-md-4">
                            <label for="aiStyle" class="form-label">Travel style</label>
                            <select class="form-select" id="aiStyle">
                                <option>Relaxed</option>
                                <option>Foodie</option>
                                <option>Adventure</option>
                                <option>Culture & history</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">
                                <span class="spinner-border spinner-border-sm d-none" id="aiSpinner"
                                    aria-hidden="true"></span>
                                Generate suggestions
                            </button>
                        </div>
                    </form>
                    <div id="aiResults" class="mt-4"></div>
                </div>
            </div>
        </section>
